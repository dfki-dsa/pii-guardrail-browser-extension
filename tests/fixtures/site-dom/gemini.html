<div class="chat-app">
  <main>
    <!-- assistant turn -->
    <user-query><div class="query-text">A synthetic question.</div></user-query>
    <model-response>
      <message-content class="model-response-text">
        <div class="markdown">
          <p>A synthetic reply mentioning [PERSON_1].</p>
        </div>
      </message-content>
    </model-response>
    <!-- composer -->
    <rich-textarea>
      <div
        class="ql-editor textarea new-input-ui"
        contenteditable="true"
        role="textbox"
        aria-label="Enter a prompt here"><p><br></p></div>
    </rich-textarea>
  </main>
</div>
